# Production cutover of the owner-approved Variant C static artifact.
name: Publish verified MORI SPACE Variant C

on:
  push:
    branches: [main]
    paths: ['release/pages-artifact.inventory.json']
  workflow_dispatch:
    inputs:
      artifact_tree_sha256:
        description: Reviewed Variant C artifact tree SHA-256
        required: true
        type: string

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

env:
  MORI_EXPECTED_TREE: '3debf9f6cdada887dde421e10a4ccb3a3690729e6df9b99aff55f29fbb271e99'

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require the confirmed target and approved main revision
        shell: bash
        env:
          MORI_REQUESTED_TREE: ${{ inputs.artifact_tree_sha256 }}
          MORI_APPROVED_COMMIT: ${{ vars.MORI_PAGES_APPROVED_COMMIT_SHA }}
        run: |
          test "$GITHUB_REPOSITORY" = 'jiashiang-dev/mori-space-v2'
          test "$GITHUB_REF" = 'refs/heads/main'
          if [[ "$GITHUB_EVENT_NAME" = workflow_dispatch ]]; then
            test "$MORI_REQUESTED_TREE" = "$MORI_EXPECTED_TREE"
            test -n "$MORI_APPROVED_COMMIT"
            test "$GITHUB_SHA" = "$MORI_APPROVED_COMMIT"
          else
            test "$GITHUB_EVENT_NAME" = push
          fi
      - name: Check out the approved revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js for verification only
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify the release verifier and exact Variant C bytes
        shell: bash
        run: |
          printf '%s\n' '17e661b46b1d317534756ebde0530b4b977280a592b4aa5085e6ce4bc25252a2  release/verify-pages-artifact.mjs' | sha256sum --check --strict
          node release/verify-pages-artifact.mjs pages-artifact release/pages-artifact.inventory.json
      - name: Upload only the verified Variant C root
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          name: github-pages
          path: pages-artifact
          retention-days: 7

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Require the approved environment artifact identity
        shell: bash
        env:
          MORI_APPROVED_TREE: ${{ vars.MORI_PAGES_APPROVED_TREE_SHA256 }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" = workflow_dispatch ]]; then
            test "$MORI_APPROVED_TREE" = "$MORI_EXPECTED_TREE"
          else
            test "$GITHUB_EVENT_NAME" = push
          fi
      - name: Read existing Pages configuration
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
        with:
          enablement: false
      - name: Require the confirmed Pages origin and base
        shell: bash
        env:
          MORI_ORIGIN: ${{ steps.pages.outputs.origin }}
          MORI_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          test "$MORI_ORIGIN" = 'https://jiashiang-dev.github.io'
          test "${MORI_BASE_PATH%/}" = '/mori-space-v2'
      - name: Deploy the verified Variant C artifact from this run
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
        with:
          artifact_name: github-pages
